name: Create Release

# A YY.MM.DD.HH.MM tag, or a run by hand with a version, builds the release
# image and creates the GitHub release. The shared workflow in
# misthelper-devtools builds the image for amd64 and arm64, pushes it to
# ghcr.io/<owner>/<repo>, and tags it with the version and latest. The build
# sets the org.opencontainers.image.version label to the version, and that
# label replaces the one in the Dockerfile.

on:
  push:
    tags:
      # Match version tags in format: YY.MM.DD.HH.MM (e.g., 26.01.12.14.30)
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (YY.MM.DD.HH.MM format, e.g., 26.01.12.14.30)'
        required: true
        type: string

permissions: {}

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@3f498b1f04da258f046894a3ea6718ea6968d583 # v0.5.1
    with:
      version: ${{ inputs.version || github.ref_name }}
      version-tag: true
      tags: |
        type=raw,value=latest

  release:
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        env:
          VERSION: ${{ needs.image.outputs.version }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" -10)
          fi

          # Create release notes
          cat << EOF > release_notes.md
          ## What's Changed

          $COMMITS

          ## Container Image

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Or use the latest tag:
          \`\`\`bash
          docker pull ${IMAGE}:latest
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.image.outputs.version }}
          name: Release ${{ needs.image.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: false