name: CodeQL Analysis

# The shared workflow of misthelper-devtools runs the CodeQL analysis for
# Python and uploads the alerts to the code scanning page of this repository.

on:
  # No branch filter here. A pull request against any base runs the scan, so a
  # stacked pull request cannot merge without a scan.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Each job names its own scopes.
permissions: {}

# A pull request run keys on its head branch, so a new commit cancels the
# previous run. A run on main has no head branch and keys on its run ID, so
# no other run can cancel it.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # The shared workflow runs the analysis in its job named analyze. Code
  # scanning keys the alerts on this file path and that job ID. Do not rename
  # this file.
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-codeql.yml@da02d4c6a2163d1882f2ad25fce80b8ba38304d1 # v0.6.2
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml
