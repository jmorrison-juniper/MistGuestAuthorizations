name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: "Offline application tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  # The shared workflow in misthelper-devtools runs each gate as its own job.
  # Each job installs requirements-dev.txt, which pins every gate tool. Each
  # check name starts with the job ID, for example "gates / Ruff (lint)".
  gates:
    permissions:
      contents: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-python-quality-gates.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      python-version: '3.13'
      cache-dependency-path: requirements-dev.txt
      ruff: true
      black: true
      mypy: true
      bandit: true
      bandit-args: -r . -ll -x ./.github,./docs,./templates
      pip-audit: true
      radon: true
      radon-max: 15
      radon-args: app.py mist_connection.py tests
      vulture: true
      vulture-args: . --min-confidence 90 --exclude .github,docs,templates

  # The shared workflow opens one issue for each failed gate on main and closes
  # that issue after the gate passes. It reads the results output of the gates.
  quality_gate_issues:
    name: "Sync quality-gate issues"
    needs: gates
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-quality-gate-issues.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      results: ${{ needs.gates.outputs.results }}
